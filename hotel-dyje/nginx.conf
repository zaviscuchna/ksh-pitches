# Hotel Dyje (hoteldyje.cz): konfigurace nginx
#
# POZOR: Coolify tento soubor z repa sám NEPOUŽÍVÁ. Aplikace "Hotel Dyje" je nixpacks
# + "Is it a static site?" a nginx konfiguraci bere z Coolify (Configuration → General →
# "Custom Nginx Configuration", pole custom_nginx_configuration). Tento soubor je její zdroj:
# po každé změně ho vlož i tam (UI, nebo API PATCH /api/v1/applications/<uuid> s
# custom_nginx_configuration v base64) a dej Redeploy.
#
# Coolify soubor ukládá jako /etc/nginx/conf.d/default.conf, tedy uvnitř bloku http,
# a proto tu může být i "map".

# Admin stránky nesmí do vyhledávačů ani v případě, že by se meta tag ztratil.
map $uri $hd_robots {
    default "";
    ~^/(hd-9k2xm7|ubytovani-4p8nq|menu-3w9jr)\.html$ "noindex, nofollow, noarchive";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Za Cloudflare/Traefikem: Location posílat relativně (jinak by nginx poslal http://…)
    absolute_redirect off;
    charset utf-8;

    # Bezpečnostní hlavičky ("always" = i u 301 a 404). Do location bloků add_header
    # nepřidávat, jinak by se tyhle hlavičky v daném bloku přestaly posílat.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # CSP: inline skripty a onclick v adminu => 'unsafe-inline'; PocketBase SDK z jsDelivr,
    # data z pb.hoteldyje.cz, fonty Google, mapa Google v iframe. connect-src obsahuje i
    # fonty/CDN kvůli service workeru (sw.js), který tyto požadavky přeposílá přes fetch().
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://pb.hoteldyje.cz; connect-src 'self' https://pb.hoteldyje.cz https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://maps.google.com https://www.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    add_header X-Robots-Tag $hd_robots always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # Staré URL z dřívějších webů (Google je má v indexu): 301 na odpovídající sekci.
    location ~* ^/(kontakt|kontakt\.php|kontakt\.htm|hotel-dyje-dacice-kontakt)/?$ {
        return 301 /#kontakt;
    }
    location ~* ^/(ubytovani|ubytovani\.php|ubytovani-dacice|pokoje|rezervace|rezervace\.php|cenik|cenik\.htm)/?$ {
        return 301 /#pokoje;
    }
    location ~* ^/(stravovani-a-akce|stravovani|stravovani\.php|stravovani-dacice|restaurace)/?$ {
        return 301 /#restaurace;
    }
    location ~* ^/(denni-menu|dennimenu\.php|menu/menu\.php)/?$ {
        return 301 /#denmenu;
    }
    location ~* ^/(aktivity|aktivity\.php|aktivity-dacice)/?$ {
        return 301 /#aktivity;
    }
    location ~* ^/(index\.php|index\.htm|hotel\.htm|foto\.htm|galerie|fotogalerie)/?$ {
        return 301 /;
    }

    # Soubory, které Coolify při buildu nakopíruje do webrootu (nginx.conf, docker-compose.yaml,
    # .nixpacks/…). Ven nesmí.
    location ~* ^/(nginx\.conf|docker-compose\.ya?ml|Dockerfile)$ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }
}
